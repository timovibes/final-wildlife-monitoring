services:
  postgres:
    image: postgres:16-alpine
    container_name: wildlife-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: final_year_wildlife_monitoring_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ml-service:
    build: ./ml-service
    container_name: wildlife-ml
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001

  backend:
    build: ./backend
    container_name: wildlife-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: final_year_wildlife_monitoring_system
      ML_SERVICE_URL: http://ml-service:5001
    depends_on:
      - postgres
      - ml-service
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: wildlife-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true

volumes:
  pgdata: